name: Release

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token request for npm Trusted Publishing
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted Publishing requires npm >= 11.5.1.
      # node 20 同梱の npm は古いため最新化する。
      - name: Update npm to latest (for trusted publishing support)
        run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test -- --reporter=verbose

      - name: Build
        run: pnpm build

      - name: Set version from release tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      # Trusted Publishing: OIDC token は npm が自動で取得・検証する。
      # NPM_TOKEN は不要。--provenance で SLSA 由来証明を npm 上に公開。
      - name: Publish to npm
        run: npm publish --provenance --access public
