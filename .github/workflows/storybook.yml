name: Deploy Storybook

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 2つの Storybook を storybook-static/{app,web}/ にビルドし、
      # ルートに行き先を選ぶ index.html を置く。
      #   https://siracusa-hq.github.io/DesignSystem/app/  … 業務システムUI
      #   https://siracusa-hq.github.io/DesignSystem/web/  … Web/LP
      - name: Build Storybook (app + web)
        run: pnpm build-storybook
        env:
          PAGES_BASE: /DesignSystem/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
