name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm のバージョンはルート package.json の packageManager から解決される。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 以下はいずれも `pnpm -r` でワークスペース全体（tokens / ui-app / ui-web）を回す。
      # tokens が先に処理されるよう pnpm が依存グラフ順に実行する。
      #
      # **Build を最初に置くこと。** ui-app / ui-web は `@siracusahq/tokens` を
      # `dist/index.d.ts` 経由で型解決するため、tokens が未ビルドだと
      # typecheck も test も TS2307 で落ちる。
      - name: Build
        run: pnpm build

      # テーマ契約の生成物（css/brand.css / generated-brand.css）はコミットする運用。
      # 再生成して差分が出る = レジストリと生成物がズレている（コミット漏れ or 手編集）。
      - name: Codegen
        run: pnpm codegen

      - name: Verify codegen committed
        run: git diff --exit-code

      # CSS Modules の契約: 生hex / 名前色 / --ramp-* 直参照を禁止
      - name: Stylelint (CSS Modules)
        run: pnpm --filter @siracusahq/gtm-design-system lint:css

      # 配布物が消費側で動くことの検証（SSR + CSSマッピング + Netlify属性）。
      # Storybook でも vitest でも見えない配布事故（styles={} 等）を止める最後の砦
      - name: Consumer smoke (dist)
        run: pnpm --filter @siracusahq/gtm-design-system smoke

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Size check
        run: pnpm size

  # ページ単位のビジュアル回帰テスト（stage5-workorder.md Slice 0）。
  # check job とは独立に並列で走る。Storybook のビルドと Chromium の取得が要るため
  # check より重く、check の結果を待たせる理由もない。
  vrt:
    name: Visual regression (pages)
    # 基準 PNG は devcontainer（Debian 13 / arm64）で生成してコミットしている。
    # 同じ PNG が Ubuntu 24.04 の arm64 / amd64 コンテナでも 1px の差もなく通ることを
    # マージ前に実測済み（stage5-workorder.md §7-2）。フォントを Google Fonts の
    # webfont で固定し、ヒンティングと LCD 描画を切っているため OS・CPU 差を受けない。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `...` は「依存パッケージも含める」の意味（tokens → ui-web）。
      # ui-app は VRT に無関係なのでビルドしない。
      # Storybook の vite は @siracusahq/tokens を dist 経由で解決するため必須。
      - name: Build (tokens → ui-web)
        run: pnpm --filter "@siracusahq/gtm-design-system..." build

      - name: Install Chromium
        run: pnpm --filter @siracusahq/gtm-design-system exec playwright install chromium --with-deps

      # 和文の webfont（Noto Sans JP）は Google Fonts から取得するのが本線で、
      # これはその取得が欠けたときに豆腐（□）ではなく和文が出るための保険。
      # ※ webfont が読めていない場合は vrt/pages.spec.ts が明示的に落とす
      - name: Install Japanese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk

      # Storybook（web のみ）のビルドを含む。app 側は VRT の対象外
      - name: VRT
        run: pnpm --filter @siracusahq/gtm-design-system vrt

      # 差分が目視できないと VRT の運用は回らない。
      # test-results/ に actual / expected / diff の3枚が、report/ に HTML レポートが入る。
      - name: Upload diff artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vrt-diff
          path: |
            packages/ui-web/vrt/test-results
            packages/ui-web/vrt/report
          retention-days: 14
          if-no-files-found: warn

  # Astro 消費側結合テスト（stage5-workorder.md Slice 2）。
  # check / vrt と並列。consumer smoke（renderToString）では見えない
  # 「Astro のビルドを1枚挟んだときの生成物」を検証する。
  #
  # LP の本番リポジトリはプライベートで、そこに検査を足すと運用が二重になる。
  # 工場（この DS）側で毎回証明しておけば、LP 側は import して書くだけでよい。
  astro-consumer:
    name: Astro consumer build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # ルートの `pnpm build` は astro-consumer-test を**含まない**
      # （リリースの経路に消費側テストのビルドを挟まないため。package.json で除外）。
      # ここで作るのは tokens → ui-web の dist で、消費側はそれを workspace 越しに読む。
      - name: Build (tokens → ui-app → ui-web)
        run: pnpm build

      - name: Build Astro app
        run: pnpm --filter astro-consumer-test build

      - name: Verify build output
        run: pnpm --filter astro-consumer-test verify

      # 落ちたときに「生成物のどこが違うのか」を手元で見られるようにする。
      # HTML/CSS はテキストなので diff が取れる（VRT の PNG と違って目視が要らない）
      - name: Upload build output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: astro-consumer-dist
          path: packages/astro-consumer-test/dist
          retention-days: 14
          if-no-files-found: warn

  changeset:
    name: Changeset present
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # packages/ 配下を触った PR に changeset が無いと、リリースが漏れる。
      # 「意図的に不要」な場合は空の changeset (`pnpm changeset --empty`) を置く。
      - name: Verify changeset for package changes
        run: |
          BASE="origin/${{ github.base_ref }}"
          CHANGED=$(git diff --name-only "$BASE"...HEAD -- packages/ | grep -v '/CHANGELOG.md$' || true)
          if [ -z "$CHANGED" ]; then
            echo "packages/ に変更なし。changeset 不要。"
            exit 0
          fi
          if git diff --name-only "$BASE"...HEAD -- .changeset \
            | grep -E '\.changeset/.+\.md$' | grep -qv '\.changeset/README\.md$'; then
            echo "changeset あり。"
            exit 0
          fi
          echo "::error::packages/ を変更していますが changeset がありません。'pnpm changeset' を実行して結果をコミットしてください。"
          exit 1
