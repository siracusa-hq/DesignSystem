name: Release

# モノレポ化に伴い、リリースの起点を「GitHub Release の手動作成」から
# 「changesets が作る Version PR のマージ」に変更した。
# 3パッケージが独立したバージョンを持つため、タグ1本から版を決められないため。
#
# 流れ:
#   1. changeset 付きの PR が main にマージされる
#   2. このワークフローが version 更新 + CHANGELOG 生成を行い
#      `changeset-release/main` ブランチに push する
#   3. 同じ実行の中で Version PR を作る（GitHub App のトークンで。下記の注意を参照）
#   4. その PR をマージすると、このワークフローが npm publish + タグ作成まで行う
#
# ※ org のポリシーで、GitHub Actions のトークン（GITHUB_TOKEN）による PR 作成は禁止されている。
#   そのため PR は GitHub App のトークンで作る（secrets.RELEASE_APP_ID・RELEASE_APP_PRIVATE_KEY）。
#   App のトークンで作った PR には CI も走る（GITHUB_TOKEN で作った PR には走らない）。
#   secrets が未登録のときは従来どおり GITHUB_TOKEN で動き、PR の作成だけが 403 で失敗する。
#   その場合は手で作る:
#     gh pr create --base main --head changeset-release/main \
#       --title "chore: release packages" --fill
#   詳細は CLAUDE.md「リリース運用」を参照。
#
# ※ npm Trusted Publishing はリポジトリとワークフロー**ファイル名**に紐づくため、
#   `release.yml` というファイル名は変更しないこと（既存の信頼設定が外れる）。
on:
  push:
    branches: [main]
  # 復旧用の手動実行。Version PR のマージより先に「新しい changeset を含む PR」を
  # マージしてしまうと、changesets/action は publish ではなく次の Version PR 作成の
  # 経路に入り、バンプ済みバージョンが未公開のまま残る（0.6.0 で実際に発生）。
  # その場合はこのトリガーで publish だけを実行する。
  # `changeset publish` は「package.json の版が npm に無いパッケージ」だけを
  # 公開するため、二重公開の危険はない。
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # Version PR のブランチ push とタグ作成
      pull-requests: write # Version PR の作成／更新
      id-token: write # OIDC token request for npm Trusted Publishing
    env:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
    steps:
      # Version PR を作るための GitHub App のトークン（secrets が未登録なら飛ばす）。
      # checkout にも渡し、changeset-release/main への push も App 名義にする（PR の更新でも CI が走る）
      - name: GitHub App トークンの発行
        id: app-token
        if: env.RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}

      - uses: pnpm/action-setup@v4

      # registry-url は OIDC trigger に必要 (.npmrc に registry エントリを書く)。
      # 外すと npm CLI は OIDC を試みず ENEEDAUTH になる (v0.3.5 で確認)。
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted Publishing requires npm >= 11.5.1。
      # changeset publish は内部で `npm publish` を呼ぶため、PATH 上の npm を差し替える。
      - name: Update npm to 11 (for trusted publishing support)
        run: npm install -g npm@11

      # setup-node は registry-url 指定時に `.npmrc` へ
      # `//registry.npmjs.org/:_authToken=XXXXX-XXXXX-XXXXX-XXXXX` placeholder
      # と `always-auth=true` を書き込む。NODE_AUTH_TOKEN 未設定時の placeholder
      # を npm publish が優先送信して OIDC fallback が動かず 404 になる
      # (v0.3.4 で確認)。registry エントリは残し、auth 行のみ削除して OIDC に倒す。
      - name: Strip placeholder _authToken from .npmrc (force OIDC auth)
        run: |
          if [ -f ~/.npmrc ]; then
            sed -i -e '/_authToken=XXXXX/d' -e '/always-auth/d' ~/.npmrc
            echo "Cleaned ~/.npmrc:"
            cat ~/.npmrc
          fi

      - run: pnpm install --frozen-lockfile

      # Build を最初に置くこと（理由は ci.yml のコメント参照）。
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # publish は `pnpm release` (= pnpm build && changeset publish)。
      # --provenance は各 package.json の publishConfig.provenance: true から
      # changesets が付与する（SLSA 由来証明を npm 上に公開）。
      - name: Create Version PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: 'chore: release packages'
          title: 'chore: release packages'
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

  # workflow_dispatch 専用: 未公開バージョンの publish のみ実行する（上記コメント参照）
  publish-only:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write # タグ作成
      id-token: write # OIDC token request for npm Trusted Publishing
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Update npm to 11 (for trusted publishing support)
        run: npm install -g npm@11

      - name: Strip placeholder _authToken from .npmrc (force OIDC auth)
        run: |
          if [ -f ~/.npmrc ]; then
            sed -i -e '/_authToken=XXXXX/d' -e '/always-auth/d' ~/.npmrc
            echo "Cleaned ~/.npmrc:"
            cat ~/.npmrc
          fi

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Publish unpublished versions
        run: |
          pnpm release
          git push --tags
