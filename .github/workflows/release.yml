name: Release

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token request for npm Trusted Publishing
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      # registry-url は OIDC trigger に必要 (.npmrc に registry エントリを書く)。
      # 外すと npm CLI は OIDC を試みず ENEEDAUTH になる (v0.3.5 で確認)。
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted Publishing requires npm >= 11.5.1.
      # npm@latest(12+) は node 22+ を要求し node 20 と非互換(EBADENGINE)になるため、
      # node 20 対応かつ Trusted Publishing 要件を満たす npm@11 系に固定する。
      - name: Update npm to 11 (for trusted publishing support)
        run: npm install -g npm@11

      # setup-node は registry-url 指定時に `.npmrc` へ
      # `//registry.npmjs.org/:_authToken=XXXXX-XXXXX-XXXXX-XXXXX` placeholder
      # と `always-auth=true` を書き込む。NODE_AUTH_TOKEN 未設定時の placeholder
      # を npm publish が優先送信して OIDC fallback が動かず 404 になる
      # (v0.3.4 で確認)。registry エントリは残し、auth 行のみ削除して OIDC に倒す。
      - name: Strip placeholder _authToken from .npmrc (force OIDC auth)
        run: |
          if [ -f ~/.npmrc ]; then
            sed -i -e '/_authToken=XXXXX/d' -e '/always-auth/d' ~/.npmrc
            echo "Cleaned ~/.npmrc:"
            cat ~/.npmrc
          fi

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test -- --reporter=verbose

      - name: Build
        run: pnpm build

      - name: Set version from release tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      # Trusted Publishing: OIDC token は npm が自動で取得・検証する。
      # NPM_TOKEN は不要。--provenance で SLSA 由来証明を npm 上に公開。
      - name: Publish to npm
        run: npm publish --provenance --access public
